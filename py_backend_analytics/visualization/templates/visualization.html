<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>

    <link rel="stylesheet" href="py_backend_analytics/visualization.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
</head>

<body>
<header>
    <div class="header-left">
        <div class="logo">📈</div>
        <h1>py-backend-analytics</h1>
    </div>
    <div class="header-right">
        <a href="https://github.com/KrzysztofCzapla/py-backend-analytics" id="github-link" target="_blank" class="github-btn fa">&#xf09b;</a>
    </div>
</header>

<main>
    <div class="period-selector">
        <button class="period-btn active" data-period="all_time">All Time</button>
        <button class="period-btn" data-period="last_24h">Last 24 Hours</button>
        <button class="period-btn" data-period="last_month">Last Month</button>
        <button class="period-btn" data-period="last_year">Last Year</button>
    </div>

    <div class="graph-card">
        <div class="graph-header">
            <h2 id="graph-title">Total Visits • All Time</h2>
        </div>

        <canvas id="visitsChart"></canvas>
    </div>

    <div class="tiles-container" id="stats-tiles"></div>
</main>

<script>
window.analyticsData = {
    all_time: {{ all_time | tojson }},
    last_24h: {{ last_24h | tojson }},
    last_month: {{ last_month | tojson }},
    last_year: {{ last_year | tojson }}
};
</script>

<script src="py_backend_analytics/visualization.js"></script>
</body>
</html>
