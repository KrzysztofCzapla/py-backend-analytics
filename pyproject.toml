[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-backend-analytics"
version = "0.5.0"
description = "easy-to-setup network analytics for python backends"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "maxminddb>=3.1.1"
]

[project.optional-dependencies]
sqlite = [
  "aiosqlite>=0.22.1",
]

postgres = [
  "asyncpg"
]

[dependency-groups]
test = [
    "pytest",
    "aiosqlite>=0.22.1",
    "asyncpg",
    "pytest-asyncio",
    "fastapi",
    "uvicorn",
    "jinja2",
    "httpx"
]

[tool.setuptools.package-data]
py_backend_analytics = ["**/*.css", "**/*.html"]
